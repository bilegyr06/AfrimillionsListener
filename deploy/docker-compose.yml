# Operator-facing deployment. Pulls prebuilt images from GHCR instead of building.
# Usage (in this folder):
#   .\start.ps1        first-time start
#   .\update.ps1       pull newest images and restart
#   .\stop.ps1         stop everything
#
# Requirements:
#   - Docker Desktop installed and running
#   - docker authenticated to ghcr.io (run: docker login ghcr.io -u <github-username>)
#   - .env file in this folder (copy from the project, contains Termii credentials)
#   - data\ and database\ folders in this folder (CSV drops and SQLite state)
#
# To pin a specific release instead of latest, set AFRI_VERSION before running, e.g.:
#   $env:AFRI_VERSION = "1.2.0"

services:
  afrimillions:
    image: ghcr.io/bilegyr06/afrimillions-backend:${AFRI_VERSION:-latest}
    pull_policy: always
    container_name: afrimillions_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    environment:
      - DATA_FOLDER=/app/data
      - DB_PATH=/app/database/notified_users.db
      - TZ=Africa/Lagos

  frontend:
    image: ghcr.io/bilegyr06/afrimillions-frontend:${AFRI_VERSION:-latest}
    pull_policy: always
    container_name: afrimillions_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - afrimillions