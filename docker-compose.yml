services:
  afrimillions:
    build: ./backend
    container_name: afrimillions_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    environment:
      - DATA_FOLDER=/app/data
      - DB_PATH=/app/database/notified_users.db
      - TZ=Africa/Lagos

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://afrimillions:8000
    container_name: afrimillions_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - afrimillions
